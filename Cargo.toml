[package]
name = "portfolio"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
leptos = { version = "0.8.15", features = ["csr"] }
three-d = { version = "0.18.2" }
three-d-asset = { version = "0.9.2", features = ["data-url", "http", "gltf", "image", "vol", "png"] }
regex = { version = "1.8.1", optional = true }
web-sys = { version = "0.3.62", features = ["Window", "Storage", "Document", "Location", "Element", "IntersectionObserver", "IntersectionObserverInit", "IntersectionObserverEntry", "History", "ScrollRestoration", "EventTarget"] }
wasm-bindgen = "0.2.85"
js-sys = "0.3.62"
futures = "0.3.28"
leptos_icons = { version = "0.7.0" }
icondata = { version = "0.6.0", features = ["charm"] }
rand = "0.8.5"
getrandom = { version = "0.2.10", features = ["js"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
log = "0.4"
console_log = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

[dependencies.gltf]
version = "*"
features = ["KHR_materials_ior", "KHR_materials_transmission", "KHR_mesh_quantization"]

[patch.crates-io]
# using fork with KHR_mesh_quantization implemented
gltf = { git = "https://github.com/gltf-rs/gltf", rev = "refs/pull/463/head" }

